name: Build Zynx ISO

on:
  workflow_dispatch:
    inputs:
      browser:
        description: "Navegador: firefox, netsurf ou none"
        default: firefox

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Localizar o projeto (zip enviado ou pasta)
        run: |
          if [ -f zynx-os.zip ]; then unzip -q zynx-os.zip; fi
          if [ -d zynx-os ]; then echo "SRC=$PWD/zynx-os" >> "$GITHUB_ENV"; else echo "SRC=$PWD" >> "$GITHUB_ENV"; fi

      - name: Liberar espaco e instalar dependencias
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          sudo apt-get update
          sudo apt-get install -y debootstrap ubuntu-keyring squashfs-tools xorriso \
            grub-pc-bin grub-efi-amd64-bin grub-common mtools dosfstools

      - name: Gerar a ISO
        working-directory: ${{ env.SRC }}
        env:
          BROWSER: ${{ inputs.browser }}
        run: sudo make BROWSER="${BROWSER:-firefox}"

      - uses: actions/upload-artifact@v4
        with:
          name: zynx-os-iso
          path: ${{ env.SRC }}/*.iso
          compression-level: 0
